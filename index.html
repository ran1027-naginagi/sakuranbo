<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=M+PLUS+1p:wght@400;500;700;800&display=swap">

<style>
:root{
  --bg:#FAF5F4; --dot:#EBDFDD; --surface:#FFFFFF; --surface-2:#F4ECEA;
  --edge:#DFD1CE; --line:#E8DCD9;
  --ink:#2C1D1E; --ink-2:#6E585A; --ink-3:#A69194;
  --red:#BC4552; --red-deep:#8B303B; --red-soft:#F7E7E7; --on-fill:#FFFFFF;
  --cream:#D9A441; --clay:#96705C; --mustard:#BC8F2C;
  --sage:#5F8F6B; --sage-deep:#3F6249; --sage-soft:#E3EDE4; --sage-ink:#3A5C44;
  --smoke:#4E7EA3; --smoke-deep:#2F5B7C; --smoke-soft:#E1EAF1; --smoke-ink:#2A5273;
  --taupe:#8E8280;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1315; --dot:#271D1F; --surface:#231A1C; --surface-2:#2F2427;
    --edge:#0F0A0B; --line:#3A2C2F;
    --ink:#F3E8E8; --ink-2:#C0A9AB; --ink-3:#8A7477;
    --red:#D9636E; --red-deep:#8B303B; --red-soft:#3A2124; --on-fill:#1E1012;
    --cream:#E3B75C; --clay:#B78D75; --mustard:#DFB04A;
    --sage:#7FB78C; --sage-deep:#2A3D2E; --sage-soft:#1E2E22; --sage-ink:#8FC49C;
    --smoke:#6FA8CE; --smoke-deep:#22394A; --smoke-soft:#1B2A34; --smoke-ink:#8CBEDD;
    --taupe:#B0A29F;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1315; --dot:#271D1F; --surface:#231A1C; --surface-2:#2F2427;
  --edge:#0F0A0B; --line:#3A2C2F;
  --ink:#F3E8E8; --ink-2:#C0A9AB; --ink-3:#8A7477;
  --red:#D9636E; --red-deep:#8B303B; --red-soft:#3A2124; --on-fill:#1E1012;
  --cream:#E3B75C; --clay:#B78D75; --mustard:#DFB04A;
  --sage:#7FB78C; --sage-deep:#2A3D2E; --sage-soft:#1E2E22; --sage-ink:#8FC49C;
  --smoke:#6FA8CE; --smoke-deep:#22394A; --smoke-soft:#1B2A34; --smoke-ink:#8CBEDD;
  --taupe:#B0A29F;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; color:var(--ink); background-color:var(--bg);
  background-image:
    radial-gradient(var(--dot) 5px, transparent 5.5px),
    radial-gradient(var(--dot) 5px, transparent 5.5px);
  background-size:34px 34px, 34px 34px;
  background-position:0 0, 17px 17px;
  background-attachment:fixed;
  font-family:"M PLUS 1p","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:14.5px; line-height:1.7; font-weight:400;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:480px;margin:0 auto;padding:16px 15px 64px;display:flex;flex-direction:column;gap:18px}
.num{font-family:"Archivo",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;font-family:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.star{width:1em;height:1em;flex:none;fill:currentColor}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:2px 2px 0}
.logo{flex:none}
.logo{display:flex;align-items:center;gap:8px}
.logo .mark{width:24px;height:26px;flex:none}
.logo-t{font-weight:800;font-size:16px;letter-spacing:.03em}
.themebtn{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:4px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  margin-left:auto;flex:none;
}
.month{
  font-family:"Archivo",sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.02em;
  background:var(--surface);color:var(--red);padding:4px 11px;border-radius:4px;
  border:1px solid var(--line);
}

/* hero */
.hero{
  background:var(--red);color:var(--on-fill);
  border-radius:var(--r);padding:18px 18px 16px;
  box-shadow:0 3px 0 var(--red-deep);position:relative;
}
.mascot{position:absolute;top:8px;right:6px;width:112px;pointer-events:none;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.hero-l{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.1em;opacity:.9}
.hero-l,.hero-n{padding-right:106px}
.hero-n{display:flex;align-items:baseline;gap:2px;margin-top:1px}
.hero-n .y{font-family:"Archivo",sans-serif;font-weight:600;font-size:23px;opacity:.92}
.hero-n .v{font-family:"Archivo",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;
  font-size:clamp(34px,11.5vw,46px);line-height:1.1;letter-spacing:-.015em}

.cherry-wrap{position:relative;margin:14px 0 2px;padding-bottom:20px}
.cherries{display:flex;gap:2px;justify-content:space-between}
.cherry{flex:1;max-width:30px}
.cherry svg{width:100%;height:auto;display:block}
.cherry .berry{fill:currentColor;fill-opacity:.15;stroke:currentColor;stroke-opacity:.42;stroke-width:1.4;stroke-dasharray:2.4 2.6}
.cherry .stem{stroke:currentColor;stroke-opacity:.32}
.cherry .shine{fill:transparent}
.cherry.on .berry{fill:var(--cream);fill-opacity:1;stroke:currentColor;stroke-opacity:.85;stroke-width:1.5;stroke-dasharray:none}
.cherry.on .stem{stroke:currentColor;stroke-opacity:1}
.cherry.on .shine{fill:#fff;fill-opacity:.5}
.cherry .berry,.cherry .stem,.cherry .shine{transition:fill .2s linear,stroke .2s linear,fill-opacity .2s linear}
@media (prefers-reduced-motion: reduce){.cherry .berry,.cherry .stem,.cherry .shine{transition:none}}
.cmark{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.cmark i{display:block;width:2px;height:8px;background:currentColor}
.cmark span{font-size:9px;font-weight:700;white-space:nowrap;letter-spacing:.12em}

.hero-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:11px}
.hero-f .info{font-size:12px;font-weight:500;opacity:.92}
.hero-f .info b{font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px}
.pace{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:4px;
  font-size:11.5px;font-weight:700;background:#fff;color:#8B303B}
.pace.ok{color:#33633F}

/* wallets */
.wgroup{display:flex;flex-direction:column;gap:7px}
.wglbl{display:flex;align-items:center;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.1em;padding:0 2px}
.wglbl .tot{margin-left:auto;font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);font-size:12.5px;letter-spacing:0}
.wallets{display:grid;gap:7px}
.wal{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px 10px;
  text-align:left;display:flex;flex-direction:column;gap:4px}
.wal-n{font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wal-v{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;line-height:1.1}
.wal-b{height:4px;background:var(--surface-2);overflow:hidden}
.wal-b i{display:block;height:100%;background:var(--red)}
.wal.save{background:var(--sage-soft);border-color:transparent}
.wal.save .wal-n{color:var(--sage-ink)}
.wal.save .wal-b i{background:var(--sage)}
.wal.sel{background:var(--red);border-color:var(--red);color:var(--on-fill)}
.wal.sel .wal-n{color:inherit;opacity:.9}
.wal.sel .wal-b{background:rgba(0,0,0,.2)}
.wal.sel .wal-b i{background:currentColor}
.wal.over .wal-v{color:var(--red)}
.wal.sel.over .wal-v{color:inherit}
.total-all{display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.08em}
.total-all b{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink);letter-spacing:0}

/* nudge */
.nudge{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:6px;
  background:var(--mustard);color:var(--on-fill);font-size:12.5px;font-weight:700}
.nudge .star{width:12px;height:12px}
.nudge button{margin-left:auto;padding:5px 12px;border-radius:4px;background:rgba(0,0,0,.16);
  color:inherit;font-size:12px;font-weight:700;flex:none}

/* quick amounts */
.quick{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.quick button{padding:6px 11px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);
  font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600}

/* calendar */
.calhead{display:flex;align-items:center;gap:10px;padding:0 2px 8px}
.calhead h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.05em;display:flex;align-items:center;gap:5px;flex:1}
.calhead h2 .star{color:var(--red);width:11px;height:11px}
.calnav{display:flex;gap:5px}

  function yen(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function monthKey(ts){ var d=new Date(ts); return d.getFullYear()+"-"+(d.getMonth()+1); }
  function thisMonth(){ return monthKey(Date.now()); }
  function daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
  function parseNum(s){ var n=parseInt(String(s).replace(/[^0-9]/g,""),10); return isNaN(n)?0:n; }
  function startOfDay(ts){ var d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
  var WD = ["日","月","火","水","木","金","土"];
  function pad2(n){ return (n<10?"0":"") + n; }
  function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function fromYMD(s){ var a=s.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
  function todayYMD(){ return ymd(new Date()); }
  function viewKey(){ return viewY+"-"+(viewM+1); }
  function isThisMonth(){ return viewKey() === thisMonth(); }
  /* monthly cap that steps down over time; the last step carries on */
  function capFor(y,m){
    var k=y*12+m, best=null;
    (state.capPlan||[]).forEach(function(p){
      var pk=p.y*12+p.m;
      if(pk<=k && (!best || pk>best.y*12+best.m)) best=p;
    });
    return best ? best.cap : (state.monthCap||0);
  }
  function setCap(y,m,n){
    var p=state.capPlan.filter(function(x){ return x.y===y && x.m===m; })[0];
    if(p) p.cap=n; else state.capPlan.push({ y:y, m:m, cap:n });
    state.capPlan.sort(function(a,b){ return (a.y*12+a.m)-(b.y*12+b.m); });
  }
  function seedCapPlan(){
    if(state.capPlanSeeded) return;
    state.capPlan = [
      {y:2026,m:8,cap:40000},{y:2026,m:9,cap:35000},{y:2026,m:10,cap:30000},
      {y:2026,m:11,cap:25000},{y:2027,m:0,cap:20000},{y:2027,m:1,cap:15000}
    ];
    state.capPlanSeeded = true;
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  /* an Enter that only fires once the IME has committed the text */
  function onEnter(el, fn){
    var composing = false;
    el.addEventListener("compositionstart", function(){ composing = true; });
    el.addEventListener("compositionend", function(){ composing = false; });
    el.addEventListener("keydown", function(e){
      if(e.key !== "Enter") return;
      if(composing || e.isComposing || e.keyCode === 229) return;
      e.preventDefault();
      fn();
    });
  }

  /* shrink whatever the camera roll hands us down to something we can store */
  function pickImage(cb){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.addEventListener("change", function(){
      var f = inp.files && inp.files[0];
      if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        var img = new Image();
        img.onload = function(){
          var max = 400, w = img.width, h = img.height;
          var sc = Math.min(1, max / Math.max(w, h));
          var c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(w*sc));
          c.height = Math.max(1, Math.round(h*sc));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          try{ cb(c.toDataURL("image/jpeg", 0.72)); }
          catch(e){ toast("その画像は読めなかった"); }
        };
        img.onerror = function(){ toast("その画像は読めなかった"); };
        img.src = r.result;
      };
      r.readAsDataURL(f);
    });
    inp.click();
  }

  var THEMES = { auto:"自動", light:"白", dark:"黒" };
  function applyTheme(){
    var t = state.theme || "auto";
    if(t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    try{ localStorage.setItem("matsu-theme", t); }catch(e){}
    var b = document.getElementById("themeBtn");
    if(b) b.textContent = THEMES[t] || "自動";
  }

  function toast(msg){
    var t=document.getElementById("toast");
    document.getElementById("toastT").textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(function(){ t.classList.remove("show"); }, 1900);
  }

  /* ---------- storage ---------- */
  var PROBE = "matsu-probe";
  var lsOK = (function(){
    try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
    catch(e){ return false; }
  })();
  /* Safari hands cross-site frames a throwaway store: writes succeed, then vanish.
     The only way to know is to leave a marker and look for it next time. */
  var lsPersists = null;   /* null = not known yet (first ever visit) */
  if(lsOK){
    try{
      var hadProbe = !!localStorage.getItem(PROBE);
      var hadData  = !!localStorage.getItem(KEY);
      /* a marker survived, or real data did: this browser keeps things */
      lsPersists = (hadProbe || hadData) ? true : null;
      localStorage.setItem(PROBE, String(Date.now()));
    }catch(e){ lsOK=false; }
  }
  var cloudVer = "";
  var cloudErrCode = "";
  var booted = false;      /* never write to the cloud before we have read from it */
  var dirty = false;       /* there are changes the cloud has not seen */
  var pushing = false;

  function readLocal(){
    if(!lsOK) return null;
    try{ var s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; }
  }
  function writeLocal(){
    if(!lsOK) return;
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ lsOK=false; }
  }
  function adopt(d){
    if(!d || typeof d!=="object") return;
    if(typeof d.cooldownDays==="number") state.cooldownDays = d.cooldownDays;
    if(typeof d.monthCap==="number") state.monthCap = d.monthCap;
    if(d.theme) state.theme = d.theme;
    if(Array.isArray(d.entries)) state.entries = d.entries;
    if(Array.isArray(d.wants)) state.wants = d.wants;
    if(Array.isArray(d.plans)) state.plans = d.plans;
    if(Array.isArray(d.capPlan)) state.capPlan = d.capPlan;
    if(d.capPlanSeeded) state.capPlanSeeded = true;
    if(Array.isArray(d.wallets) && d.wallets.length) state.wallets = d.wallets;
    state.updatedAt = d.updatedAt || 0;
    migrate();
  }
  function migrate(){
    if(!state.wallets.length){ state.wallets = defaultWallets(); return; }
    var defs = defaultWallets(), byId = {};
    defs.forEach(function(d){ byId[d.id] = d; });
    state.wallets.forEach(function(w){
      if(typeof w.balance !== "number") w.balance = byId[w.id] ? byId[w.id].balance : 0;
      if(!w.kind) w.kind = byId[w.id] ? byId[w.id].kind : "spend";
      delete w.budget;
    });
    defs.forEach(function(d){ if(d.kind==="save" && !walById(d.id)) state.wallets.push(d); });
    var first = (spendWallets()[0] || state.wallets[0]).id;
    state.entries.forEach(function(e){ if(!e.wallet && !e.from) e.wallet = first; });
  }

  function save(){
    state.updatedAt = Date.now();
    dirty = true;
    writeLocal();
    /* hosted by herself: the local write IS the save, nothing to wait for */
    if(!(window.claude && window.claude.use)) dirty = false;
    render();
    if(!booted || !cloudOK){ showStatus(); return; }
    showStatus();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushCloud, 800);   /* short: she closes the app fast */
  }

  function pushCloud(){
    if(!booted || !cloudOK || !cloud || pushing || !dirty) return;
    pushing = true;
    var snapshot = state.updatedAt;
    var files={}; files[FILE]=JSON.stringify(state);
    cloud.publish(files).then(function(res){
      pushing = false;
      cloudVer = (res && res.version) ? String(res.version) : "ok";
      cloudErrCode = "";
      if(state.updatedAt === snapshot) dirty = false;
      else pushCloud();
      showStatus();
    }).catch(function(err){
      pushing = false;
      var c = err && err.code;
      cloudErrCode = c || "ふめい";
      if(c==="conflict"){ dirty=false; cloudErrCode=""; showStatus(); return; }
      if(c==="rate_limited"){ clearTimeout(saveTimer); saveTimer=setTimeout(pushCloud,12000); showStatus(); return; }
      if(c==="upstream_error"){ clearTimeout(saveTimer); saveTimer=setTimeout(pushCloud,5000); showStatus(); return; }
      cloudOK=false; cloudWhy = "エラー: " + (c || "ふめい"); showStatus();
    });
  }

  /* the app is being backgrounded — get the change out now, not in 800ms */
  function flush(){
    if(!dirty || !cloudOK) return;
    clearTimeout(saveTimer);
    pushCloud();
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") flush();
  });
  window.addEventListener("pagehide", flush);
  window.addEventListener("blur", flush);

  var cloudWhy = "";
  function showStatus(){
    var bar=document.getElementById("savebar");
    var pc=document.getElementById("pillCloud"), pl=document.getElementById("pillLocal");
    var msg=document.getElementById("saveMsg"), btn=document.getElementById("saveNow");
    var why=document.getElementById("saveWhy");

    var standalone = !(window.claude && window.claude.use);   /* hosted by herself */
    var cloudGood = cloudOK && !cloudErrCode;
    var localGood = lsOK && lsPersists !== false;

    if(standalone){
      pc.className = "pill"; pc.textContent = "じぶんのサイト";
      pl.className = "pill" + (localGood ? "" : " no");
      pl.textContent = "この端末 " + (localGood ? "○" : "×");
      if(!booted){ bar.className="savebar"; msg.textContent="よみこみ中…"; btn.hidden=true; why.hidden=true; return; }
      if(localGood){
        bar.className="savebar";
        msg.textContent = dirty ? "保存中…" : "保存済み";
        btn.hidden = true; why.hidden = true;
      }else{
        bar.className="savebar warn";
        msg.textContent = "保存できてない！";
        btn.hidden = true; why.hidden = false;
        why.textContent = "設定から「バックアップ」を取ってね";
      }
      return;
    }

    pc.className = "pill" + (cloudGood ? "" : " no");
    pc.textContent = "クラウド " + (cloudGood ? (cloudVer ? "○ 書けた" : "○") : "×");
    pl.className = "pill" + (localGood ? "" : " no");
    pl.textContent = "この端末 " + (localGood ? "○" : "×");

    if(!booted){ bar.className="savebar"; msg.textContent="よみこみ中…"; btn.hidden=true; why.hidden=true; return; }

    if(!cloudGood && !localGood){
      bar.className="savebar warn";
      msg.textContent = "保存できてない！閉じたら消えるよ";
      btn.hidden = true; why.hidden = false;
      why.textContent = "設定から「バックアップ」を取ってね。"
        + (cloudErrCode ? "クラウド: " + cloudErrCode + "。" : cloudWhy ? cloudWhy + "。" : "")
        + (lsPersists === false ? "このブラウザは端末に残してくれない。" : "");
      return;
    }
    if(!cloudGood){
      bar.className="savebar warn";
      msg.textContent = "この端末にだけ保存されてるよ";
      btn.hidden = true; why.hidden = false;
      why.textContent = (cloudErrCode ? "クラウド: " + cloudErrCode : cloudWhy || "クラウドが使えない");
      return;
    }
    if(!localGood){
      bar.className="savebar";
      msg.textContent = dirty ? "保存中…" : "クラウドに保存済み";
      btn.hidden = !dirty; why.hidden = true;
      return;
    }
    bar.className="savebar";
    msg.textContent = dirty ? "保存中…" : "保存済み";
    btn.hidden = !dirty; why.hidden = true;
  }

  function setStatus(){ showStatus(); }

  /* ---------- derived ---------- */
  function isSpend(e){ return e.type !== "in" && e.type !== "move"; }
  function monthEntries(){
    var mk=viewKey();
    return state.entries.filter(function(e){ return isSpend(e) && monthKey(e.ts)===mk; });
  }
  function entriesOn(ds){
    return state.entries.filter(function(e){ return ymd(new Date(e.ts))===ds; });
  }
  function plansOn(ds){
    return state.plans.filter(function(p){ return p.date===ds; });
  }
  /* money already earmarked for the rest of this month */
  function upcomingPlanTotal(){
    var t=todayYMD();
    return state.plans.filter(function(p){
      return p.amount>0 && p.date>=t && monthKey(fromYMD(p.date).getTime())===thisMonth();
    }).reduce(function(a,p){ return a+p.amount; },0);
  }
  function monthSpent(){ return monthEntries().reduce(function(a,e){ return a+e.amount; }, 0); }
  /* only the everyday wallets count against the cap — savings were already earmarked */
  function monthSpentCapped(){
    return monthEntries().reduce(function(a,e){
      var w=walById(e.wallet); return (w && w.kind==="save") ? a : a+e.amount;
    },0);
  }
  function monthSpentSaved(){
    return monthEntries().reduce(function(a,e){
      var w=walById(e.wallet); return (w && w.kind==="save") ? a+e.amount : a;
    },0);
  }
  function monthSaved(){
    var mk=viewKey();
    return state.wants.filter(function(w){
      return w.status==="dropped" && w.doneTs && monthKey(w.doneTs)===mk;
    }).reduce(function(a,w){ return a+(w.amount||0); },0);
  }

  function cherrySVG(){
    return '<svg viewBox="0 0 22 30" aria-hidden="true">'
      + '<path class="stem" d="M10 13 C10 8, 12.5 4, 18 3" fill="none" stroke-width="1.8" stroke-linecap="round"/>'
      + '<circle class="berry" cx="10" cy="21.2" r="7.2"/>'
      + '<ellipse class="shine" cx="7.6" cy="18.6" rx="2" ry="1.3"/></svg>';
  }

  /* ---------- render ---------- */
  function render(){
    seedCapPlan();
    var now=new Date();
    document.getElementById("monthLabel").textContent =
      (now.getMonth()+1)+"/"+now.getDate()+"("+WD[now.getDay()]+") "
      + now.getHours()+":"+pad2(now.getMinutes());

    var cur = isThisMonth();
    var cap=capFor(viewY,viewM), used=monthSpentCapped(), fromSave=monthSpentSaved();
    var left=cap-used, usable=sumBal(spendWallets()), saved=sumBal(saveWallets());
    var dim=daysInMonth(now), day=now.getDate();

    document.getElementById("heroL").textContent =
      cur ? "今月 あとつかえる" : (viewM+1)+"月 のこった";
    document.getElementById("spentL").textContent =
      cur ? "今月つかった" : (viewM+1)+"月につかった";
    document.getElementById("heroN").innerHTML =
      '<span class="y">'+(left<0?"−¥":"¥")+'</span>'
      + '<span class="v">'+Math.abs(Math.round(left)).toLocaleString("ja-JP")+'</span>';
    document.getElementById("spentM").textContent = yen(used)
      + (fromSave>0 ? "（+ 貯金から "+yen(fromSave)+"）" : "");

    var box=document.getElementById("cherries");
    if(box.children.length!==NCHERRY){
      var h=""; for(var i=0;i<NCHERRY;i++) h+='<span class="cherry">'+cherrySVG()+'</span>';
      box.innerHTML=h;
    }
    var frac = cap>0 ? Math.max(0,Math.min(1,left/cap)) : 0;
    var on = Math.ceil(frac*NCHERRY);
    if(left>0 && on===0) on=1;
    for(var j=0;j<NCHERRY;j++) box.children[j].classList.toggle("on", j<on);

    var cm=document.getElementById("cmark");
    var p=document.getElementById("pace");
    if(cur){
      cm.hidden=false;
      var projLeft = cap - (day>0 ? used/day*dim : 0);
      var pfrac = cap>0 ? Math.max(0,Math.min(1,projLeft/cap)) : 0;
      cm.style.left = Math.max(3,Math.min(97,pfrac*100))+"%";
      if(left<0){ p.className="pace"; p.textContent=yen(-left)+" オーバー"; }
      else if(projLeft<0){ p.className="pace"; p.textContent="このままだと "+yen(-projLeft)+" オーバー"; }
      else if(projLeft<cap*0.1){ p.className="pace"; p.textContent="月末ギリギリかも"; }
      else { p.className="pace ok"; p.textContent="月末 "+yen(projLeft)+" あまりそう"; }
    }else{
      cm.hidden=true;
      p.className = left<0 ? "pace" : "pace ok";
      p.textContent = left<0 ? yen(-left)+" オーバーした" : "上限 "+yen(cap);
    }

    /* what is already spoken for */
    var strip=document.getElementById("planStrip");
    var up = cur ? upcomingPlanTotal() : 0;
    if(cur && up>0){
      strip.hidden=false;
      var reallyLeft = left - up;
      strip.classList.toggle("bad", reallyLeft<0);
      document.getElementById("planStripT").textContent =
        "よてい "+yen(up)+" をひくと じつは";
      document.getElementById("planStripV").textContent =
        (reallyLeft<0?"−":"")+yen(Math.abs(reallyLeft));
    }else strip.hidden=true;

    renderNudge();
    renderQuick();
    renderWallets();
    renderWsel();
    renderCalendar();
    renderDayPanel();
    renderDatePick();
    renderStreak();
    renderWants();
    renderBreakdown(monthSpent());
    renderLog();
    renderWalEdit();

    document.getElementById("totSpend").textContent = yen(usable);
    document.getElementById("totSave").textContent = yen(saved);
    document.getElementById("totAll").textContent = yen(usable+saved);
    document.getElementById("cap").value = cap;
    document.getElementById("capL").textContent = (viewM+1)+"月につかう上限";
    renderCapPlan();
    document.getElementById("cdays").value = state.cooldownDays;
    document.getElementById("cdNote").textContent = state.cooldownDays+"日 寝かせてから決める";
    document.getElementById("brkTtl").textContent = cur ? "今月のうちわけ" : (viewM+1)+"月のうちわけ";
    document.getElementById("savedTtl").textContent = (cur?"今月":(viewM+1)+"月")+" がまんできた分";

    var sv=monthSaved(), sb=document.getElementById("savedBox");
    sb.hidden = sv<=0;
    document.getElementById("savedAmt").textContent = yen(sv);

    var allSaved=0, waited=0, impulsed=0;
    state.wants.forEach(function(w){
      if(w.status==="dropped") allSaved += (w.amount||0);
      else if(w.status==="bought"){ if(w.impulse) impulsed++; else waited++; }
    });
    var st=document.getElementById("statsBox");
    if(allSaved>0 || waited>0 || impulsed>0){
      st.hidden=false;
      var parts=[];
      if(allSaved>0) parts.push("ぜんぶで <b>"+yen(allSaved)+"</b> うかせた");
      if(waited>0) parts.push("待てた "+waited+"回");
      if(impulsed>0) parts.push('<span class="imp">即ポチ '+impulsed+"回</span>");
      st.innerHTML = parts.join(" · ");
    }else st.hidden=true;
  }

  /* the whole point is that she opens the app and is reminded on the spot */
  function renderNudge(){
    var n=document.getElementById("nudge"), t=todayYMD();
    var spentToday = state.entries.some(function(e){
      return isSpend(e) && ymd(new Date(e.ts))===t;
    });
    if(spentToday){ n.hidden=true; return; }
    var yst = ymd(new Date(Date.now()-DAY));
    var spentYst = state.entries.some(function(e){
      return isSpend(e) && ymd(new Date(e.ts))===yst;
    });
    n.hidden=false;
    document.getElementById("nudgeT").textContent =
      spentYst ? "今日まだつけてないよ" : "しばらくつけてないよ。使ってないならそれでOK";
  }

  /* amounts she types over and over, one tap away */
  function renderQuick(){
    var q=document.getElementById("quick");
    if(mode!=="out"){ q.innerHTML=""; return; }
    var freq={};
    state.entries.forEach(function(e){
      if(isSpend(e) && e.amount>0) freq[e.amount]=(freq[e.amount]||0)+1;
    });
    var top=Object.keys(freq).map(function(k){ return {v:+k, n:freq[k]}; })
      .filter(function(x){ return x.n>=2; })
      .sort(function(a,b){ return b.n-a.n || b.v-a.v; })
      .slice(0,4);
    q.innerHTML = top.map(function(x){
      return '<button data-v="'+x.v+'">'+yen(x.v)+'</button>';
    }).join("");
  }

  /* ---------- calendar ---------- */
  function renderCalendar(){
    document.getElementById("calTitle").textContent = viewY+"年 "+(viewM+1)+"月";
    var first=new Date(viewY,viewM,1), n=new Date(viewY,viewM+1,0).getDate();
    var lead=first.getDay(), t=todayYMD(), h="";
    for(var i=0;i<lead;i++) h+='<div class="cell pad"></div>';
    for(var d=1;d<=n;d++){
      var ds=viewY+"-"+pad2(viewM+1)+"-"+pad2(d);
      var wd=new Date(viewY,viewM,d).getDay();
      var es=entriesOn(ds), ps=plansOn(ds);
      var kinds={};
      es.forEach(function(e){ kinds[e.type==="in"?"in":e.type==="move"?"mv":"out"]=1; });
      var marks="";
      ["out","in","mv"].forEach(function(k){ if(kinds[k]) marks+='<i class="'+k+'"></i>'; });
      h += '<button class="cell'+(wd===0?" sun":wd===6?" sat":"")
         + (ds===t?" today":"")+(ds===selDate?" sel":"")+'" data-d="'+ds+'">'
         + (ps.length ? '<svg class="plan"><use href="#sp"/></svg>' : "")
         + '<span class="dnum">'+d+'</span>'
         + '<span class="marks">'+marks+'</span></button>';
    }
    document.getElementById("calGrid").innerHTML = h;
  }

  function renderDayPanel(){
    var d=fromYMD(selDate);
    document.getElementById("dayTtl").textContent =
      (d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）"
      + (selDate===todayYMD() ? " · 今日" : "");

    var es=entriesOn(selDate);
    document.getElementById("dayEnt").innerHTML = es.map(function(e){
      var tag, txt;
      if(e.type==="in"){ tag='<span class="tag in">入った</span>'; var w=walById(e.wallet); txt=(w?w.name:"")+(e.memo?" · "+e.memo:""); }
      else if(e.type==="move"){ tag='<span class="tag mv">うつした</span>'; var f=walById(e.from),t2=walById(e.to); txt=(f?f.name:"?")+" → "+(t2?t2.name:"?"); }
      else { tag='<span class="tag" style="--c:'+catColor(e.cat)+'">'+esc(e.cat)+'</span>'; var w2=walById(e.wallet); txt=(w2?w2.name:"")+(e.memo?" · "+e.memo:""); }
      return '<div class="dline">'+tag+'<span>'+esc(txt)+'</span>'
           + '<span class="amt">'+(e.type==="in"?"＋":"")+yen(e.amount)+'</span></div>';
    }).join("");

    var ps=plansOn(selDate);
    document.getElementById("planList").innerHTML = ps.map(function(p){
      return '<div class="prow" data-id="'+esc(p.id)+'">'
        + '<span class="pn">'+esc(p.name)+'</span>'
        + (p.amount>0 ? '<span class="pa">'+yen(p.amount)+'</span>'
                        + '<button class="pdone" data-act="spend">つかった</button>' : "")
        + '<button class="px" data-act="delplan" aria-label="消す">×</button></div>';

    if(!es.length && !ps.length){
      document.getElementById("dayEnt").innerHTML =

  function walCard(w, maxBal){
    var bal=w.balance||0;
    var pct = maxBal>0 ? Math.max(0,Math.min(100,Math.round(bal/maxBal*100))) : 0;
    var sel = (mode==="move" ? w.id===walFrom : w.id===walFrom);
    return '<button class="wal'+(w.kind==="save"?" save":"")+(bal<0?" over":"")+(sel?" sel":"")+'"'
      + ' data-id="'+esc(w.id)+'">'
      + '<span class="wal-n">'+esc(w.name)+'</span>'
      + '<span class="wal-v">'+(bal<0?"−":"")+yen(Math.abs(bal))+'</span>'
      + '<span class="wal-b"><i style="width:'+pct+'%"></i></span></button>';
  }
  function renderWallets(){
    var sp=spendWallets(), sv=saveWallets();
    var mSp=sp.reduce(function(a,w){ return Math.max(a,w.balance||0); },0);
    var mSv=sv.reduce(function(a,w){ return Math.max(a,w.balance||0); },0);
    var a=document.getElementById("walSpend");
    a.style.gridTemplateColumns="repeat("+Math.min(3,Math.max(1,sp.length))+",1fr)";
    a.innerHTML=sp.map(function(w){ return walCard(w,mSp); }).join("");
    var b=document.getElementById("walSave");
    b.parentNode.hidden = sv.length===0;
    b.style.gridTemplateColumns="repeat("+Math.min(3,Math.max(1,sv.length))+",1fr)";
    b.innerHTML=sv.map(function(w){ return walCard(w,mSv); }).join("");

  function renderStreak(){
    var d=document.getElementById("dots"), t=document.getElementById("streakT");
    var sp=state.entries.filter(isSpend);
    if(!sp.length){ d.innerHTML=""; t.innerHTML="まだ記録がないよ"; return; }
    var last=sp.reduce(function(a,e){ return Math.max(a,e.ts); },0);
    var days=Math.floor((startOfDay(Date.now())-startOfDay(last))/DAY);
    var N=Math.min(days,21), h="";
    for(var i=0;i<N;i++) h+='<span class="dot"></span>';
    d.innerHTML = days===0 ? "" : h;
    t.innerHTML = days===0 ? "今日おかいものした" : "前回のおかいものから <b>"+days+"</b> 日";

  function renderWants(){
    var box=document.getElementById("wants");
    var waiting=state.wants.filter(function(w){ return w.status==="waiting"; });
    if(!waiting.length){
      box.innerHTML='<div class="empty">ほしいものが浮かんだら、まずここに寝かせる。<br>'
        + state.cooldownDays+'日たってもまだ欲しかったら買う。</div>';
      return;
    }
    var now=Date.now();
    waiting.sort(function(a,b){ return a.ts-b.ts; });
    box.innerHTML=waiting.map(function(w){
      var need=state.cooldownDays*DAY, passed=now-w.ts, ready=passed>=need;
      var pct=Math.min(100,Math.round(passed/need*100)), rem=need-passed, txt;
      if(ready) txt=STAR+state.cooldownDays+"日 待てた！まだ欲しい？";
      else if(rem>DAY) txt="あと "+Math.ceil(rem/DAY)+" 日";
      else txt="あと "+Math.max(1,Math.ceil(rem/3600000))+" 時間";
      var thumb = w.img
        ? '<button class="thumb" data-act="pic"><img src="'+w.img+'" alt=""></button>'
        : '<button class="thumb" data-act="pic">画像を<br>入れる</button>';
      return '<div class="want" data-id="'+esc(w.id)+'">'
        + '<div class="want-main">' + thumb + '<div class="want-body">'
        + '<div class="want-top"><span class="want-n">'+esc(w.name)+'</span>'
        + '<span class="want-a">'+(w.amount?yen(w.amount):"")+'</span></div>'
        + '<div class="bar'+(ready?" done":"")+'"><i style="width:'+pct+'%"></i></div>'
        + '</div></div>'
        + '<div class="want-f"><span class="want-s'+(ready?" ready":"")+'">'+txt+'</span>'
        + '<button class="mini stop" data-act="drop">やめとく</button>'
        + '<button class="mini'+(ready?" go":"")+'" data-act="buy">買った</button></div></div>';
    }).join("");

  function renderBreakdown(spent){
    var box=document.getElementById("brk");
    document.getElementById("totalNote").innerHTML='今月 <b>'+yen(spent)+'</b>';
    var ms=monthEntries();
    if(!ms.length){ box.innerHTML='<div class="empty">今月はまだ使ってないよ</div>'; return; }
    var sums={};
    ms.forEach(function(e){ sums[e.cat]=(sums[e.cat]||0)+e.amount; });
    var rows=Object.keys(sums).map(function(k){ return {k:k,v:sums[k]}; });
    rows.sort(function(a,b){ return b.v-a.v; });
    var max=rows[0].v;
    box.innerHTML=rows.map(function(r){
      return '<div class="brow" style="--c:'+catColor(r.k)+'">'
        + '<span class="bdot"></span><span class="bn">'+esc(r.k)+'</span>'
        + '<span class="bv">'+yen(r.v)+'</span>'
        + '<span class="bb"><i style="width:'+Math.round(r.v/max*100)+'%"></i></span></div>';
    }).join("");
  }

  function renderLog(){
    var box=document.getElementById("log");
    var list=state.entries.slice().sort(function(a,b){ return b.ts-a.ts; }).slice(0,30);
    document.getElementById("logNote").textContent = state.entries.length ? "最近 "+list.length+" 件" : "";
    if(!list.length){ box.innerHTML='<div class="empty">ここに記録がたまっていくよ</div>'; return; }
    box.innerHTML=list.map(function(e){
      var d=new Date(e.ts), tag, where, cls="", sign="";
      if(e.type==="in"){
        cls=" in"; sign="＋"; tag='<span class="tag in">入った</span>';
        var w=walById(e.wallet);
        where = w ? '<span class="w">'+esc(w.name)+'</span>' : "";
      }else if(e.type==="move"){
        cls=" mv"; tag='<span class="tag mv">うつした</span>';
        var f=walById(e.from), t2=walById(e.to);
        where='<span class="w">'+esc(f?f.name:"?")+' → '+esc(t2?t2.name:"?")+'</span>';
      }else{
        tag='<span class="tag" style="--c:'+catColor(e.cat)+'">'+esc(e.cat)+'</span>';
        var w2=walById(e.wallet);
        where = w2 ? '<span class="w">'+esc(w2.name)+'</span>' : "";
      }
      var memo = where + ((where && e.memo) ? " · " : "") + esc(e.memo||"");
      return '<div class="ent'+cls+'" data-id="'+esc(e.id)+'">'
        + '<span class="ent-d">'+(d.getMonth()+1)+"/"+d.getDate()+'</span>'
        + tag
        + (e.impulse?'<span class="imp-tag">即ポチ</span>':'')
        + '<span class="ent-m">'+memo+'</span>'
        + '<span class="ent-a">'+sign+yen(e.amount)+'</span>'

  /* a record filed on another day keeps the current time, just on that date */
  function stampFor(ds){
    if(!ds || ds===todayYMD()) return Date.now();
    var d=fromYMD(ds); d.setHours(12,0,0,0); return d.getTime();
  }
  function addSpend(amount, cat, memo, impulse, walId, ds){
    var w=walById(walId)||walById(walFrom)||state.wallets[0];
    state.entries.push({ id:uid(), ts:stampFor(ds||selDate), amount:amount, cat:cat,
      memo:memo||"", impulse:!!impulse, wallet:w.id });
    w.balance=(w.balance||0)-amount;
    save();
  }

  addBtn.addEventListener("click", function(){
    var n=parseNum(amtEl.value); if(n<=0) return;
    var memo=document.getElementById("memo").value.trim();
    var f=walById(walFrom); if(!f) return;

    if(mode==="in"){
      state.entries.push({ id:uid(), ts:stampFor(selDate), amount:n, type:"in", memo:memo, wallet:f.id });
      f.balance=(f.balance||0)+n;
      save(); toast(f.name+" に "+yen(n)+" 入れたよ");
      setMode("out");
    }else if(mode==="move"){
      var t=walById(walTo);
      if(!t || t.id===f.id){ toast("うつす先を選んでね"); return; }
      state.entries.push({ id:uid(), ts:stampFor(selDate), amount:n, type:"move", memo:memo, from:f.id, to:t.id });
      f.balance=(f.balance||0)-n;
      t.balance=(t.balance||0)+n;
      save(); toast(f.name+" → "+t.name+" に "+yen(n));
      setMode("out");
    }else{
      if(f.kind==="save" && !confirm("「"+f.name+"」から "+yen(n)+" 出す？\nためてるお金だよ")) return;
      addSpend(n, pickedCat, memo, false, f.id);
      toast(f.name+" から つけたよ");

    amtEl.value=""; document.getElementById("memo").value=""; syncBtn();
  });

        var f=walById(gone.from), t=walById(gone.to);
        if(f) f.balance=(f.balance||0)+gone.amount;

        if(w) w.balance=(w.balance||0)+(gone.type==="in" ? -gone.amount : gone.amount);
      }
    }
    save(); toast("もどしたよ");
  });

    state.wallets=state.wallets.filter(function(x){ return x.id!==id; });

  document.getElementById("capPlan").addEventListener("click", function(ev){
    var b=ev.target.closest(".del"); if(!b) return;
    var i=+b.closest(".wrow").dataset.i, p=state.capPlan[i]; if(!p) return;
    state.capPlan.splice(i,1); save(); toast((p.m+1)+"月の上限を けした");
  });
  document.getElementById("addCapM").addEventListener("click", function(){
    var last=state.capPlan[state.capPlan.length-1], t=new Date();
    var y=last?last.y:t.getFullYear(), m=last?last.m+1:t.getMonth();
    if(m>11){ m=0; y++; }
    setCap(y,m,last?last.cap:(state.monthCap||15000)); save();
  });
  document.getElementById("cdays").addEventListener("change", function(){
    var n=parseNum(this.value);
    if(n>=1 && n<=30){ state.cooldownDays=n; save(); } else this.value=state.cooldownDays;
  });
  document.getElementById("wipeMonth").addEventListener("click", function(){
    if(!confirm("今月の支出の記録を全部消す？もどせないよ\n（残高は変わらないよ）")) return;
    var mk=thisMonth();
    state.entries=state.entries.filter(function(e){ return !isSpend(e) || monthKey(e.ts)!==mk; });
    save(); toast("今月の支出を消したよ");
  });
  document.getElementById("themeBtn").addEventListener("click", function(){
    var order = ["auto","light","dark"];
    var i = order.indexOf(state.theme || "auto");
    state.theme = order[(i+1) % order.length];
    applyTheme();
    save();
    toast(state.theme==="light" ? "白にしたよ" : state.theme==="dark" ? "黒にしたよ" : "端末に合わせるよ");
  });

  document.getElementById("saveTest").addEventListener("click", function(){
    var out=document.getElementById("testOut");
    out.hidden=false;
    out.textContent="ためしてるよ…";
    if(!window.claude || !window.claude.use){ out.textContent="× claude が見つからない（このひらき方だとクラウドは使えない）"; return; }
    window.claude.use("artifact").then(function(ns){
      if(!ns || !ns.publish){ out.textContent="× クラウドの機能がもらえてない（not granted）"; return; }
      var files={}; files[FILE]=JSON.stringify(state);
      return ns.publish(files).then(function(res){
        cloud=ns; cloudOK=true; cloudErrCode=""; dirty=false;
        cloudVer=(res&&res.version)?String(res.version):"ok";
        out.textContent="○ 書けた！ バージョン "+cloudVer+" ／ 端末保存は "
          + (lsPersists===false?"効いてない":"効いてる");
        showStatus();
      });
    }).catch(function(err){
      cloudErrCode=(err&&err.code)||"ふめい";
      out.textContent="× 書けなかった： "+cloudErrCode+"（"+((err&&err.message)||"")+"）";
      cloudOK=false; showStatus();
    });
  });

  document.getElementById("saveNow").addEventListener("click", function(){
    clearTimeout(saveTimer);
    pushCloud();
    toast("保存してるよ");
  });

  document.getElementById("restore").addEventListener("click", function(){
    var inp=document.createElement("input");
    inp.type="file"; inp.accept="application/json,.json";
    inp.addEventListener("change", function(){
      var f=inp.files && inp.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(){
        try{
          var d=JSON.parse(r.result);
          if(!d || !Array.isArray(d.wallets)) throw 0;
          if(!confirm("このバックアップで今のデータを置きかえる？")) return;
          adopt(d);
          save();
          finishBoot();
          toast("読みこんだよ");
        }catch(e){ toast("そのファイルは読めなかった"); }
      };
      r.readAsText(f);
    });
    inp.click();
  });

  document.getElementById("backup").addEventListener("click", function(){
    if(!window.claude || !window.claude.use){ toast("バックアップは使えないみたい"); return; }
    window.claude.use("downloads").then(function(dl){
      if(!dl){ toast("バックアップは使えないみたい"); return; }
      return dl.save({
        filename:"sakuranbo-"+new Date().toISOString().slice(0,10)+".json",
        data:JSON.stringify(state,null,2)
      }).then(function(){ toast("保存したよ"); });
    }).catch(function(){ toast("保存できなかった"); });
  });

  /* ---------- boot ---------- */
  function finishBoot(){
    var t=new Date();
    if(viewY===undefined){ viewY=t.getFullYear(); viewM=t.getMonth(); }
    if(!selDate) selDate=todayYMD();
    try{ walFrom=localStorage.getItem(SELKEY); }catch(e){}
    if(!walById(walFrom)){
      var sp=spendWallets();
      walFrom = (sp[0]||state.wallets[0]||{}).id || null;
    }
    if(!walById(walTo)){
      var sv=saveWallets();
      walTo = (sv[0]||state.wallets[state.wallets.length-1]||{}).id || null;
    }
    setMode("out");
    render();
  }
  function boot(){
    var local=readLocal();
    var fileP=fetch(FILE,{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
    var capP=(window.claude && window.claude.use) ? window.claude.use("artifact").catch(function(){ return null; }) : Promise.resolve(null);

    Promise.all([fileP,capP]).then(function(res){
      var remote=res[0]; cloud=res[1]; cloudOK=!!(cloud && cloud.publish);
      if(!cloudOK) cloudWhy = cloud ? "publishが使えない" : "このひらき方だとクラウドが使えない";
      var lu=(local&&local.updatedAt)||0, ru=(remote&&remote.updatedAt)||0;
      if(remote && ru>=lu) adopt(remote);
      else if(local) adopt(local);
      else migrate();
      booted = true;
      applyTheme();
      /* local was ahead of the cloud (offline edits) — send them up */
      if(cloudOK && local && lu>ru){ dirty=true; pushCloud(); }
      showStatus();
      finishBoot();
    }).catch(function(){
      booted = true; showStatus(); finishBoot();
    });

    migrate();
    applyTheme();
    finishBoot();
    showStatus();

    var lastDay = todayYMD();
    setInterval(function(){
      var t = todayYMD();
      if(t !== lastDay){
        if(selDate === lastDay){
          var d = fromYMD(t);
          viewY = d.getFullYear(); viewM = d.getMonth();
          selDate = t;
        }
        lastDay = t;
      }
      render();
      if(dirty) flush();
    }, 60000);
  }
  boot();
})();
</script>

</body>
</html>
